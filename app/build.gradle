plugins { id 'com.android.application' }
android {
  namespace 'com.hijri.converter'
  compileSdk 34
  defaultConfig {
    applicationId 'com.hijri.converter'
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  sourceSets { main { assets.srcDirs = ['../docs'] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
